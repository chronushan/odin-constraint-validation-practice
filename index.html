<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Favorite fruit start</title>
		<style>
			input:invalid {
				border: 2px dashed red;
			}

			input:valid {
				border: 2px solid black;
			}

			form {
				display: flex;
				flex-direction: column;
			}

			input {
				width: 200px;
				margin-bottom: 20px;
			}

			button {
				margin-right: auto;
			}
		</style>
		<script defer src="index.js"></script>
	</head>

	<body>
		<form action="">
			<label for="email">Please write your email:</label>
			<input id="email" type="email" />
			<label for="country">Please write your country:</label>
			<input id="country" type="text" />
			<label for="postal-code">Please write your postal-code:</label>
			<input id="postal-code" type="text" />
			<label for="password">Please write your password:</label>
			<input id="password" type="password" />
			<label for="password-confirm">Please confirm your password:</label>
			<input id="password-confirm" type="password" />
			<button>Submit</button>
		</form>
	</body>
</html>
